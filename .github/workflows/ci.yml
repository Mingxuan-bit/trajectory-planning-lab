name: Demo checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Basic planning smoke run
        run: python -B -m planner_lab.run --max-steps 2 --out outputs/smoke-basic
      - name: MPPI smoke run
        run: python -B -m planner_lab.run_mppi --scenarios crossing --seeds 1 --max-steps 2 --rollouts 8 --horizon 4 --out outputs/smoke-mppi
